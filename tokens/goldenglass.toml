# GoldenGlass — tokens de diseño (única fuente de verdad)
#
# Todo lo visual sale de aquí. Tras editar, regenerar con:
#   python3 tools/gen_tokens.py
#
# Formato de color: "#RRGGBB" o "#RRGGBBAA". Los colores con alfa se aplanan
# sobre el fondo de su rol al generar formatos que no admiten transparencia
# (p. ej. .colors de KDE).
#
# Valores marcados "calibrar" son iniciales: Apple no publica las cifras exactas
# de macOS 27 y se ajustan contra capturas.

[meta]
name = "GoldenGlass"
# La versión no va aquí: sale del archivo VERSION (la misma de CMake y del
# PKGBUILD) y los generadores la ven como meta.version.

# ---------------------------------------------------------------------------
# Geometría (px lógicos)
# ---------------------------------------------------------------------------
[radius]
window = 12          # calibrar: macOS 27 cierra el radio respecto a Tahoe
control = 6          # botones, campos de texto, combos
control_small = 4    # checkboxes, controles compactos
field = 10           # campos de texto de Plasma (Spotlight, contraseña)
menu = 10            # menús emergentes
popup = 14           # diálogos de Plasma, notificaciones, Centro de control
dock = 14
menubar = 0          # barra de menús con fondo: recta, como macOS. ≤ plasma.menubar_height / 2:
                     # Plasma limita la altura de todo panel a la suma de sus esquinas (ver plasma_theme)
tooltip = 6

# Anillo de foco de los campos de texto, como en macOS: color de acento
# translúcido pegado al borde del campo, sin halo difuminado.
[focus_ring]
width = 3            # ancho total del anillo
alpha = 0.5          # opacidad del acento

# ---------------------------------------------------------------------------
# Vidrio — niveles del slider (0.0 = más claro, 1.0 = más opaco)
# El slider es continuo; estos son los valores en las 3 muescas.
# "alpha" es la opacidad del fondo de las superficies de vidrio.
# ---------------------------------------------------------------------------
[glass]
default_level = 0.5
blur_strength = 10   # KWin Blur: 1..15, calibrar
# Módulo de Ajustes «Vidrio»: al soltar el slider a menos de esto de una
# muesca, queda en ella; con el teclado se aplica tras esta pausa
snap_distance = 0.04
keyboard_apply_ms = 400

[glass.notch.clear]
position = 0.0
alpha = 0.40

[glass.notch.medium]
position = 0.5
alpha = 0.65

[glass.notch.opaque]
position = 1.0
alpha = 0.90

[glass.border]
alpha = 0.14         # filo de las tarjetas QML (Tile, panel de Apps): color de texto con esta opacidad
# Filo del Plasma Style (macOS 27: «more uniform refraction and improved
# contrast»): una línea oscura fina por fuera y una clara justo dentro. Colores
# fijos (negro y blanco) con alfa: valen en claro y en oscuro — calibrar
shade_alpha = 0.16       # línea exterior negra
highlight_alpha = 0.22   # línea interior blanca
width = 1                # ancho de cada línea (px)

# Saturación/contraste del fondo difuminado detrás del vidrio ("vibrancy").
# Se escribe en el plasmarc del Plasma Style.
[glass.vibrancy]
contrast = 1.0
intensity = 1.0
saturation = 1.8     # calibrar

# Refracción de Liquid Glass (efecto de KWin goldenglass_glass, solo superficies
# de Plasma). Medidas en px lógicos. Con el nivel de vidrio más claro se aplica
# entera; con el más opaco, por opaque_factor (macOS 27 hace lo mismo).
[glass.refraction]
edge = 18            # ancho de la zona del borde que se curva — calibrar
strength = 10        # desplazamiento del fondo en el mismo borde — calibrar
opaque_factor = 0.25 # fracción de la refracción con el vidrio más opaco
dispersion = 0.35    # separación de colores (fracción de strength)
clarity = 0.5        # en el borde, cuánto se ve el fondo nítido (no difuminado)
specular = 0.10      # brillo del filo, encima de la ventana (más arriba que abajo) — calibrar
tint = 0.10          # acerca la luminancia del fondo a la media (legibilidad)
edge_max_fraction = 0.3  # en superficies bajas (el dock), la zona curvada no pasa de esta fracción del lado menor
rim_width = 0.3      # ancho del filo de luz (fracción de edge)
rim_bottom = 0.35    # brillo del filo abajo respecto a arriba
# Filo y oscurecido siguen al nivel con su propio factor (la lente usa
# opaque_factor): con el vidrio más opaco el contraste del borde importa más
rim_opaque_factor = 0.6  # fracción del filo y del oscurecido con el vidrio más opaco — calibrar
edge_shade = 0.18        # oscurecido multiplicativo de la banda exterior — calibrar
edge_shade_width = 1.5   # ancho de esa banda (px lógicos) — calibrar

# ---------------------------------------------------------------------------
# Escritorio Plasma (px lógicos)
# ---------------------------------------------------------------------------
[plasma]
menubar_height = 24      # como macOS; las barras de 28 px pasan a 24 al actualizar (updates/ del shell)
menubar_padding_v = 2    # margen del fondo de la barra (prefijo north- del panel)
# Barra de menús sin fondo, como macOS 26/27 (el texto va sobre el fondo de
# pantalla). true = franja de vidrio translúcido, la opción «Mostrar fondo de la
# barra de menús» de macOS 27 (módulo Vidrio, goldenglass-glass).
menubar_background = false
# Con varias pantallas, opacidad de la barra de menús de las que no tienen la
# ventana activa (macOS la atenúa)
menubar_inactive_opacity = 0.5
menubar_item_padding = 11   # margen a cada lado del nombre de la app y de cada menú
menubar_item_inset = 3      # margen arriba y abajo del resaltado de cada menú (> 0)
menubar_tray_spacing = 16   # separación entre iconos de estado (múltiplo de 4)
dock_icon_size = 48
dock_padding = 6         # margen entre el borde del dock y los iconos
# Dock como en macOS con «Ocultar y mostrar automáticamente»: escondido hasta
# llevar el cursor al borde inferior. none | autohide | dodgewindows
dock_hiding = "autohide"
# Animación de deslizamiento de KWin (dock al aparecer/ocultarse y popups de
# Plasma): entra decelerando y sale acelerando. KWin usa 200 ms por defecto.
slide_in_ms = 280
slide_out_ms = 220
# Escritorios independientes por pantalla, como «Las pantallas tienen espacios
# independientes» de macOS (opción de KWin desde Plasma 6.7)
per_screen_desktops = true
popup_margin = 10        # margen de contenido de diálogos y popups
tooltip_margin = 6
popup_shadow = 28        # tamaño de la sombra de popups y dock
popup_shadow_alpha = 0.30
tooltip_shadow = 12
tooltip_shadow_alpha = 0.22
task_dot_size = 4        # indicador de app abierta en el dock
# gestor de tareas del Plasma Style (widgets/tasks.svg): opacidad del punto
# (color de texto) según el estado de la app. Si pide atención, el punto es
# naranja: el neutral de la paleta activa (light.neutral / dark.neutral)
task_dot_alpha = 0.55            # abierta (y al pasar el ratón: macOS no resalta)
task_dot_minimized_alpha = 0.35
task_dot_focus_alpha = 0.85
task_progress_alpha = 0.35       # progreso (color de acento)
item_hover_alpha = 0.10  # resaltado de listas bajo el cursor (sobre color de texto); también en las apps (estilo)
item_selected_alpha = 0.28  # selección de listas (sobre color de acento)
item_selected_hover_boost = 0.08  # selección bajo el cursor: item_selected_alpha + esto
item_padding_v = 4       # margen del contenido de cada elemento de lista
item_padding_h = 8
# campos de texto (KRunner/Spotlight, contraseña de bloqueo): sobre el color de texto
field_alpha = 0.08       # relleno
field_border_alpha = 0.14
field_hover_alpha = 0.28 # anillo al pasar el ratón
field_padding_v = 6      # margen del texto dentro del campo
field_padding_h = 10

# ---------------------------------------------------------------------------
# Sombras de ventana
# ---------------------------------------------------------------------------
[shadow]
color = "#000000"    # sombras de ventanas (decoración) y de menús (estilo)
outline_alpha = 0.4  # contorno oscuro de la ventana en la sombra (se multiplica por la fuerza)

# Valores de fábrica de la decoración: tamaño (px, se redondea a la opción
# ShadowSize más cercana) y fuerza (ShadowStrength)
[shadow.active]
size = 64
strength = 0.45

# Ventanas sin foco: sombra más corta y suave, como macOS 27 (referencia no
# verificada: un tercio a la mitad del radio y ~55 % de la opacidad de la
# activa). Nunca mayor que la activa: gen_tokens lo rechaza y la decoración
# usa min(inactiva, activa) con los valores del usuario. Sin interfaz: solo
# goldenglassrc [Common] InactiveShadowSize / InactiveShadowStrength.
[shadow.inactive]
size = 32        # calibrar (ShadowMedium)
strength = 0.25  # calibrar

# Cada opción de ShadowSize (las de Breeze): dos sombras superpuestas, una
# principal centrada (radius, alpha) y otra más corta (ambient_*), y el
# conjunto bajado offset px. Las opacidades se multiplican por ShadowStrength.
[shadow.sizes.small]
offset = 4
radius = 16
alpha = 1.0
ambient_offset = -2
ambient_radius = 8
ambient_alpha = 0.4

[shadow.sizes.medium]
offset = 8
radius = 32
alpha = 0.9
ambient_offset = -4
ambient_radius = 16
ambient_alpha = 0.3

[shadow.sizes.large]
offset = 12
radius = 48
alpha = 0.8
ambient_offset = -6
ambient_radius = 24
ambient_alpha = 0.2

[shadow.sizes.very_large]
offset = 16
radius = 64
alpha = 0.7
ambient_offset = -8
ambient_radius = 32
ambient_alpha = 0.1

# ---------------------------------------------------------------------------
# Animaciones de los controles de las apps (estilo) y de los botones de la
# ventana (decoración): una sola duración, ajustable en cada módulo
# ---------------------------------------------------------------------------
[animation]
controls_ms = 150

# ---------------------------------------------------------------------------
# Movimiento de los plasmoids (Motion.qml): todos los *_ms de animación de los
# plasmoids ([apps], [scroll], [dock], [control_center]) son duraciones a
# velocidad normal (factor 1) y se multiplican por la «Velocidad de animación»
# global de Plasma (kdeglobals [KDE] AnimationDurationFactor). No se escalan
# las esperas que no son animaciones: label_delay_ms, preview_hide_ms,
# bar_hide_ms y glass_update_ms.
# ---------------------------------------------------------------------------
[motion]
# Kirigami.Units.longDuration con factor 1: Plasma da max(1, round(esto ×
# factor)), así que el factor es longDuration ÷ esto (spike SP-04)
kirigami_long_ms = 200
# con «Reducir movimiento», fundido que sustituye a escalas y desplazamientos
reduced_fade_ms = 150

# ---------------------------------------------------------------------------
# Efectos de ventana de KWin (goldenglass-windows): valores de fábrica que se
# escriben en kwinrc solo si el usuario no los tocó (docs/ARCHITECTURE.md
# «Efectos de ventana»)
# ---------------------------------------------------------------------------
[kwin]
# Efecto «Escalar» al abrir y cerrar ventanas: la ventana nace a open_scale
# de su tamaño y se va hacia close_scale (KWin trae 0.8 en los dos). Calibrar.
open_scale = 0.92
close_scale = 0.95
# duración a velocidad normal: KWin la multiplica por la velocidad de animación global
window_anim_ms = 220
# con «Reducir movimiento», efecto de minimizar: "none" (ninguno), "squash" o "magiclamp"
reduce_motion_minimize = "none"

# ---------------------------------------------------------------------------
# Decoración de ventanas
# ---------------------------------------------------------------------------
[decoration]
# macOS centra el título en todo el ancho de la barra.
title_alignment = "AlignCenterFullWidth"  # AlignLeft | AlignCenter | AlignCenterFullWidth | AlignRight
# Barra de título de vidrio con la misma opacidad que la toolbar: ambas se ven
# como una sola superficie (toolbar unificada).
glass_titlebar = true
# Barra de título flotante (opción heredada de Lightly): separada del contenido
# con su propio redondeo. Apagada, como la dibuja la decoración de fábrica; el
# estilo la lee para redondear el blur de la ventana.
floating_titlebar = false
# Opciones de la decoración heredadas de Breeze, apagadas de fábrica:
title_gradient_lighter = 120   # degradado de la barra de título: arriba, QColor::lighter(%)
highlight_threshold = 130      # filo claro arriba solo en barras más oscuras que esto (qGray)
highlight_alpha = 0.118        # opacidad de ese filo blanco (30/255)

# ---------------------------------------------------------------------------
# Estilo de aplicaciones (kstyle): valores de fábrica de sus ajustes
# ---------------------------------------------------------------------------
[style]
progress_busy_step_ms = 800  # barra de progreso indeterminada: duración de cada paso
dolphin_view_alpha = 1.0     # opacidad de la vista de archivos de Dolphin
# Listas de las apps: selección bajo el cursor (QColor::lighter, %). El
# resaltado bajo el cursor es plasma.item_hover_alpha, como en Plasma.
list_selected_hover_lighter = 110

# ---------------------------------------------------------------------------
# Menús
# ---------------------------------------------------------------------------
[menu]
# macOS 27 quitó los iconos junto a cada comando: menús de solo texto, con ✓
# en el margen para las opciones activas.
show_icons = false

# ---------------------------------------------------------------------------
# Accesibilidad (como Ajustes › Accesibilidad › Pantalla de macOS)
# ---------------------------------------------------------------------------
# Valores de fábrica del grupo [Accessibility] de ~/.config/goldenglassrc
# (claves ShowBorders, ReduceTransparency y ReduceMotion): el usuario los
# cambia desde el módulo «Vidrio». Ver «Accesibilidad» en docs/ARCHITECTURE.md.
[accessibility]
show_borders = false          # borde oscuro fino en controles, campos y toolbar
reduce_transparency = false   # superficies de vidrio opacas, sin blur ni refracción
reduce_motion = false         # fundidos en lugar de escalas, desplazamientos y rebotes
# Opacidad de las superficies de vidrio con «Reducir transparencia» (0..1)
reduce_transparency_alpha = 1.0

# «Mostrar bordes» (macOS 27: Accesibilidad › Pantalla): un borde fino de color
# de texto en el vidrio, los campos, los botones y la toolbar. Opacidades 0..1
# — calibrar
[accessibility.borders]
surface_alpha = 0.50                # filo exterior del vidrio del Plasma Style
field_alpha = 0.45                  # filo de los campos del Plasma Style (KRunner, bloqueo)
edge_shade = 0.35                   # oscurecido del borde en el efecto de refracción (sin seguir al nivel)
window_outline_contrast = 0.5       # contorno de la ventana: mezcla del color de marco hacia el de texto
window_shadow_outline_alpha = 0.8   # contorno de la ventana en la sombra (× la fuerza)
control_alpha = 0.35                # filo de botones, campos y cápsulas del Finder
toolbar_button_alpha = 0.22         # forma de los botones de toolbar sin el ratón encima
gtk_alpha = 0.35                    # apps GTK (fase 2, pendiente del spike SP-02)

# ---------------------------------------------------------------------------
# Dolphin como el Finder de macOS 27 (estilo de apps + decoración)
# ---------------------------------------------------------------------------
# Sin barra de título: los semáforos van sobre la barra lateral, que llega
# hasta arriba, y la toolbar comparte esa primera fila. Botones agrupados en
# cápsulas de vidrio, el nombre de la carpeta como título y la lista con
# franjas redondeadas. Medidas calibradas con una captura de Finder (px
# lógicos); colores de cápsulas, franjas y selección en [light]/[dark].
[finder]
# Apps con la barra de título integrada (app_id de Wayland). La decoración
# solo la quita en sus ventanas con menú (las principales, no los diálogos).
apps = ["org.kde.dolphin"]
toolbar_height = 52      # primera fila: semáforos + toolbar
capsule_height = 34
capsule_gap = 9          # px entre cápsulas
button_width = 36        # cada botón dentro de una cápsula
icon_size = 18           # glifos de la toolbar
menu_arrow = 9           # chevron ⌄ de los botones con menú (Agrupar)
title_scale = 1.2        # nombre de la carpeta respecto al texto normal
selected_inset = 3       # píldora del control segmentado dentro de su cápsula
divider_height = 15      # línea entre ‹ › y entre segmentos sin seleccionar
# Liquid Glass: al pulsar, el botón cede y vuelve con un rebote; la píldora
# del control segmentado se desliza hasta el botón nuevo.
press_scale = 0.86
press_ms = 90
release_ms = 380
release_overshoot = 2.2
slide_ms = 280
slide_overshoot = 0.9    # resorte de esa píldora (Easing.OutBack)
hover_ms = 150
# Barra lateral: selección en píldora gris que se desliza entre elementos;
# el icono queda dentro de ella, como en Finder
sidebar_margin = 9             # px del borde de la barra lateral a la píldora
sidebar_icon_padding = 9       # px de la píldora al icono
sidebar_row_height = 30        # px entre una fila y la siguiente (Finder: 31 pt)
sidebar_selection_radius = 7
sidebar_slide_ms = 240
# Lista: franjas alternas y selección redondeadas, separadas de los bordes
row_inset = 9
row_radius = 6
header_padding = 8       # cabecera de columnas: margen del texto
header_arrow_width = 16  # y hueco del chevron de la columna ordenada
list_icon_size = 16      # iconos (y miniaturas) de la lista, como en Finder
# Búsqueda: la lupa se convierte en un campo en cápsula dentro de la toolbar,
# con el anillo de foco de [focus_ring]
search_width = 230

# Glifos que dibuja el estilo, como los de Finder (px lógicos)
[finder.glyphs]
search_stroke = 1.7          # lupa de la toolbar: trazo
search_radius = 5.6
search_offset = -1.5         # del círculo respecto al centro del botón
search_handle_start = 0.8    # mango: desde el borde del círculo…
search_handle_end = 5.0      # …hasta aquí
field_search_stroke = 1.6    # lupa del campo de búsqueda (otro tamaño)
field_search_radius = 5.0
field_search_offset = 1.0    # a la derecha de medio alto del campo y hacia arriba
field_search_handle_start = 0.7
field_search_handle_end = 4.2
field_search_alpha = 0.6     # opacidad (color de texto, como el texto de ayuda)
group_stroke = 1.3           # «Agrupar»: dos filas de tres cuadrados
group_cell = 4.2
group_gap = 1.8
group_radius = 1.2
more_dot = 3.4               # «⋯»: diámetro de cada punto
more_step = 6.5              # y distancia entre puntos
menu_chevron_stroke = 1.5    # ⌄ de los botones con menú
menu_chevron_width = 3.2     # semiancho
menu_chevron_height = 1.9    # semialto
header_chevron_stroke = 1.4  # flecha de la columna ordenada
header_chevron_width = 3.5
header_chevron_height = 1.8
header_chevron_inset = 4.0   # del margen derecho de la cabecera
header_unsorted_alpha = 0.6  # texto de las columnas sin ordenar
light_hit_margin = 2         # px alrededor de los semáforos que repintan al pasar
light_hit_slop = 1           # px de más en el radio de cada semáforo al pulsar

# ---------------------------------------------------------------------------
# Tipografía — familias son alias de fontconfig (ver fontconfig/)
# Tamaños en puntos de KDE (13 px de macOS ≈ 10 pt a 96 dpi)
# ---------------------------------------------------------------------------
[font]
sans = "GoldenGlass Sans"
mono = "GoldenGlass Mono"
size_general = 10
size_small = 8
size_toolbar = 10
size_menu = 10
size_window_title = 10
window_title_weight = "DemiBold"

# ---------------------------------------------------------------------------
# Semáforos (iguales en claro y oscuro)
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# Apps (lanzador del dock): panel centrado como el de Spotlight en macOS 26/27
# ---------------------------------------------------------------------------
[apps]
# Panel de Apps como el de macOS 27 (medidas calibradas con una captura):
# cabecera de buscador sin caja, etiquetas de categoría, fila de recientes,
# separador y todas las apps de la A a la Z.
width = 840          # px del panel de vidrio
height = 580
radius = 26          # esquinas del panel, más abiertas que las de un popup
margin = 20          # px entre el borde del panel y el contenido
header_height = 56   # fila del buscador (hasta la línea fina)
search_scale = 1.75  # texto del buscador respecto al texto normal
search_icon = 26     # px del glifo de Apps a la izquierda del buscador
separator_alpha = 0.14   # líneas finas (color de texto con esta opacidad)
chip_height = 26     # etiquetas de categoría: rectángulos redondeados
chip_radius = 7
chip_padding = 9     # px a cada lado del texto
chip_alpha = 0.10    # fondo de una etiqueta (color de texto)
chip_hover_alpha = 0.16
chip_selected_alpha = 0.30
columns = 7          # iconos por fila en cuadrícula
icon_size = 76       # px, cuadrícula (el squircle ocupa 52/64: ~62 px visibles)
row_height = 102     # px de cada fila de la cuadrícula
list_icon_size = 24  # px, lista
list_row_height = 36
recent = 7           # apps en la fila de recientes (una fila)
selected_alpha = 0.14    # selección con el teclado (color de texto)
selected_radius = 12
press_brightness = -0.35 # el icono se oscurece al pulsarlo, como en Launchpad
shadow_blur = 48     # sombra del panel
shadow_offset = 16
shadow_alpha = 0.35
# Al abrir, el panel crece desde open_scale con un resorte suave y aparece; al
# cerrar se encoge hasta close_scale y se desvanece, como Spotlight.
open_ms = 360
open_fade_ms = 140
open_scale = 0.94
open_overshoot = 1.0
close_ms = 160
close_scale = 0.96
close_unblur_at = 0.5    # fracción del cierre a la que se quita el blur de KWin
glass_update_ms = 32
glyph_alpha = 0.8        # glifo de Apps junto al buscador y puntos del botón «⋯»

# ---------------------------------------------------------------------------
# Iconos de apps: el squircle de vidrio (tools/icons_apps.py, wrap_icons.py)
# ---------------------------------------------------------------------------
[icon_tile]
# Colores de fondo y de símbolo; cada par es el degradado (arriba, abajo).
white = ["#FFFFFF", "#ECEFF5"]      # símbolo del icono claro
graphite = ["#3A3A3E", "#1C1C1F"]   # fondo del icono oscuro
paper = ["#FFFFFF", "#E4E6EB"]      # fondo «papel» (Filelight, Fuentes, Apps…)
wrap_paper = ["#FFFFFF", "#E6E8EC"] # fondo claro de las apps de terceros encerradas
highlight = "#FFFFFF"               # color del brillo (sheen) y del filo (rim)
shadow_color = "#000000"            # color de las sombras y del contorno fino
# Sombra del squircle (filtro SVG: desenfoque gaussiano, desplazamiento y opacidad)
shadow_blur = 1.3
shadow_dy = 1.2
shadow_alpha = 0.30
# Sombra del símbolo
glyph_shadow_blur = 0.8
glyph_shadow_dy = 0.8
glyph_shadow_alpha = 0.22
# Brillo: degradado blanco de arriba hacia el centro (opacidad arriba)
sheen_light = 0.28
sheen_dark = 0.10
# Filo de vidrio: trazo de 1 con degradado vertical (arriba, centro, abajo)
rim_width = 1
rim_top_light = 0.55
rim_top_dark = 0.30
rim_mid = 0.06
rim_bottom_light = 0.22
rim_bottom_dark = 0.12
# Contorno fino exterior
edge_alpha = 0.14
edge_width = 0.4

# Reloj de la barra de menús (plasmoid org.goldenglass.clock)
[clock]
calendar_border_alpha = 0.25 # rejilla del calendario

[scroll]
# Desplazamiento como en macOS (GlassScrollView de los plasmoids): barra
# superpuesta que solo aparece al desplazarse, rueda suave, inercia del touchpad
# y rebote elástico en los extremos.
wheel_step = 100         # px por paso de la rueda del ratón
wheel_ms = 260           # animación de cada paso de rueda
rubber_band = 0.55       # resistencia del rebote (la constante de UIScrollView)
rebound_ms = 450         # vuelta al borde tras estirarse
deceleration = 2500      # px/s², inercia al soltar el touchpad
max_velocity = 6000      # px/s
min_fling = 120          # px/s mínimos para que siga deslizándose al soltar
bar_width = 7            # tirador de la barra superpuesta
bar_hover_width = 11     # al pasar el ratón por el borde (aparece el carril)
bar_margin = 3           # px entre el tirador y el borde
bar_min = 32             # alto mínimo del tirador
bar_alpha = 0.45         # tirador (color de texto)
bar_track_alpha = 0.08   # carril, solo con el ratón encima
bar_hide_ms = 900        # sin desplazarse, la barra se esconde tras esto
bar_fade_ms = 250
edge_fade = 28           # px del borde difuminado bajo las etiquetas

[traffic_lights]
# macOS 27 (Golden Gate): gemas de vidrio algo mayores que los 12 px planos
# de Big Sur–Tahoe, con brillo arriba y abajo. Glifo tintado por botón.
diameter = 14        # px
gap = 8              # px entre bordes de círculos (centros a diameter + gap)
inactive_colored = false  # true: también en color en ventanas sin foco; false: grises hasta pasar el ratón por el grupo (macOS)
close = "#FF5F57"
close_border = "#E0443E"
close_glyph = "#4D0000"
minimize = "#FEBC2E"
minimize_border = "#DEA123"
minimize_glyph = "#995700"
zoom = "#28C840"
zoom_border = "#1AAB29"
zoom_glyph = "#006500"
# Vidrio de la gema que dibuja libgoldenglasscommon (decoración y Finder):
# opacidad 0..1 del blanco de los brillos y del negro de la sombra (en C++,
# 0..255)
gem_highlight_top = 0.784          # brillo de arriba, al empezar (200)
gem_highlight_top_end = 0.078      # y al acabar (20)
gem_highlight_bottom = 0.431       # brillo de abajo (110)
gem_shadow_alpha = 0.235           # sombra (60)
gem_shadow_inactive_alpha = 0.118  # sombra en ventanas sin foco (30)
inactive_shine = 0.45              # brillos en ventanas sin foco (fracción)
press_scale = 0.9                  # tamaño al pulsar
# Semáforos de las ventanas GTK con decoración propia (tools/gtk.py): CSS, con
# sus propios valores (decisión pendiente: no coinciden con los de la gema)
gtk_highlight_top = 0.55           # degradado de arriba
gtk_highlight_bottom = 0.35        # brillo de abajo
gtk_shadow_alpha = 0.25
gtk_inactive_border_alpha = 0.12   # filo en gris sin foco (inactive_colored = false)
gtk_glyph_scale = 0.6              # glifo respecto al icono de GTK

# ---------------------------------------------------------------------------
# Dock (plasmoid org.goldenglass.dock): ampliación, rebote, apps recientes y
# vistas previas, como el Dock de macOS. Tamaño de icono y relleno de la placa
# en [plasma] (dock_icon_size, dock_padding). Los valores de fábrica de los
# ajustes del módulo «Dock» salen de aquí.
# ---------------------------------------------------------------------------
[dock]
magnification = true     # de fábrica activada (macOS la trae apagada)
magnification_size = 96  # px del icono bajo el cursor
spread = 2.6             # iconos a cada lado que crecen con él
magnification_ms = 110   # suavizado al entrar y salir el cursor
gap = 6                  # px entre iconos
bounce = 0.55            # altura del rebote (× tamaño del icono)
bounce_ms = 360          # duración de un rebote
attention_bounces = 8    # rebotes al pedir atención (luego queda quieto)
show_recent = true       # apps recientes no fijadas, tras un separador
recent_count = 3
preview_width = 220      # px de las miniaturas de ventanas en el tooltip
preview_alpha = 0.06     # fondo de cada miniatura (color de texto)
preview_hover_alpha = 0.16
preview_active_border = 2    # px del filo de acento de la ventana activa
preview_hide_ms = 300    # margen para pasar el ratón del icono a las miniaturas
press_alpha = 0.7        # icono pulsado: más oscuro, como macOS
dot_alpha = 0.8          # punto de app abierta (color de texto)
separator_height = 0.78  # separador de apps recientes (fracción del alto)
separator_alpha = 0.22
label_delay_ms = 400     # espera antes del nombre de la app al pasar el ratón
# Rangos (px) del tamaño de icono y de la ampliación: los mismos en los
# deslizadores del módulo «Dock», en el main.xml del plasmoid (<min>/<max>:
# Plasma ajusta a ellos lo que lee) y en goldenglass-dock (los lee del main.xml
# instalado). Icono: icon_size_min–icon_size_max. Ampliación: del tamaño del
# icono a magnification_size_max (en main.xml, desde icon_size_min, porque no
# puede depender de otra opción).
icon_size_min = 32
icon_size_max = 80
magnification_size_max = 128
# Apps en segundo plano (macOS 27): una app sin ventanas cuya unit de systemd
# sigue viva lleva un punto más tenue. Fijadas siempre; no fijadas, si en la
# sesión tuvieron ventana o las lanzó el usuario (no las de inicio automático).
show_background = true        # de fábrica activado (ajuste showBackground)
background_dot_alpha = 0.35   # punto de app en segundo plano (color de texto); calibrar
background_delay_ms = 1500    # sin ventanas tanto tiempo antes de pasar a segundo plano

# ---------------------------------------------------------------------------
# Texto e iconos secundarios de los plasmoids: opacidad sobre el color de texto
# de Kirigami. No son label_secondary ni label_tertiary de las paletas (50–55 %
# y 25 %), que se aplanan sobre un fondo.
# ---------------------------------------------------------------------------
[text]
secondary_alpha = 0.7    # subtítulos, artista y álbum, tiempos, avisos
tertiary_alpha = 0.6     # títulos de sección, iconos al final de una fila, «Sin aplicaciones»
icon_alpha = 0.85        # iconos a los lados de los sliders (enteros al pasar el ratón)
disabled_alpha = 0.5     # controles deshabilitados

# ---------------------------------------------------------------------------
# Centro de control (plasmoid org.goldenglass.controlcenter): cuadrícula de 4
# columnas como la de macOS 26. Un botón redondo ocupa una celda, una píldora
# (Wi‑Fi, Bluetooth…) dos y «Reproducción» 2 × 2; los sliders, la fila entera.
# ---------------------------------------------------------------------------
[control_center]
floating_margin = 6      # px entre la barra de menús y las tarjetas
screen_margin = 8        # px entre las tarjetas y el borde derecho de la pantalla
# Animaciones de Liquid Glass. Al abrir, el vidrio brota del icono con un
# resorte: crece desde open_scale_x × open_scale_y y se pasa un poco
# (open_overshoot: el «overshoot» de Easing.OutBack) antes de asentarse.
open_ms = 420            # resorte a lo ancho
open_ms_y = 480          # a lo alto se asienta después: el vidrio «cae» de la barra
open_fade_ms = 140
open_scale_x = 0.85
open_scale_y = 0.6
open_overshoot = 1.2
switch_scale = 0.94      # vista de detalle ↔ cuadrícula: brota desde aquí
close_ms = 180           # al cerrar: se encoge hacia el icono y se desvanece
close_scale = 0.92
# KWin no difumina a medias: el vidrio se quita a esta fracción del cierre,
# cuando las tarjetas ya casi no se ven
close_unblur_at = 0.5
glass_update_ms = 32     # mínimo entre dos regiones de blur enviadas a KWin
# Al pulsar una tarjeta: cede, se ilumina desde el punto de contacto y al
# soltarla vuelve con un rebote
press_scale = 0.95
press_ms = 90
release_ms = 380
release_overshoot = 2.2
press_brighten_alpha = 0.08
press_glow_alpha = 0.22
press_glow_radius = 72   # px del brillo alrededor del punto de contacto
icon_highlight_alpha = 0.18  # resaltado del icono de la barra mientras está abierto
icon_highlight_radius = 5
icon_highlight_padding = 4   # px a cada lado del icono
icon_highlight_inset = 2     # px por arriba y por abajo dentro de la barra
cell = 64                # px del lado de una celda (botón redondo)
gap = 12                 # px entre celdas
tile_radius = 24         # tarjetas rectangulares (sliders, Reproducción)
icon_circle = 36         # círculo del icono dentro de las píldoras
icon = 20                # glifo de las píldoras
round_icon = 22          # glifo de los botones redondos
off_alpha = 0.14         # círculo de un control apagado
off_hover_alpha = 0.22
slider_height = 6        # pista de los sliders
slider_track_alpha = 0.20
# Las tarjetas son más claras que los popups, como en macOS 26: fondo de
# vidrio con esta opacidad, sin seguir el nivel de vidrio
tile_alpha = 0.30
# Vistas de detalle (clic en Wi‑Fi, Bluetooth, Enfoque, Pantalla, Sonido o
# Reproducción): una tarjeta con título, lista y «Ajustes de…»
detail_title_scale = 1.15    # título respecto al texto normal
detail_max_height = 360      # px de lista antes de desplazarse
row_height = 36
row_radius = 8
row_hover_alpha = 0.08
row_circle = 26              # círculo del icono de cada fila
row_icon = 16
separator_alpha = 0.12
switch_width = 36            # interruptor de la cabecera
switch_height = 20
switch_knob = "#FFFFFF"      # botón del interruptor
switch_knob_border_alpha = 0.08  # su filo (negro)
press_color = "#FFFFFF"      # brillo de las tarjetas al pulsar (press_brighten_alpha, press_glow_alpha)
media_pressed_alpha = 0.6    # botones de reproducción pulsados
media_disabled_alpha = 0.35  # y deshabilitados

# ---------------------------------------------------------------------------
# Pantalla de bloqueo (shell org.goldenglass.desktop, tools/shell.py): fecha y
# hora grandes arriba, avatar y contraseña en el tercio inferior, como macOS.
# ---------------------------------------------------------------------------
[lock_screen]
clock_top = 4            # gridUnit del borde superior a la fecha
date_scale = 1.6         # fecha respecto al texto normal
clock_scale = 8          # hora respecto al texto normal
clock_alpha = 0.9        # opacidad de la fecha y la hora
form_center = 0.66       # frontera avatar/contraseña (fracción del alto de la pantalla)

# ---------------------------------------------------------------------------
# Arranque (Plymouth, tools/plymouth.py): logo y barra fina como el arranque de
# Mac, con las proporciones del splash de Plasma. Medidas en px para una
# pantalla de 1080 líneas; el script las escala con la altura de la pantalla.
# El splash de Plasma (Global Themes, tools/lookandfeel.py) usa las mismas en
# gridUnit: medida ÷ grid_unit (salvo bar_height, en px), y los colores de
# [boot.dark] / [boot.light] (fondo, barra y pista) para no saltar al pasar.
# ---------------------------------------------------------------------------
[boot]
grid_unit = 18           # gridUnit de Plasma con la fuente por defecto
logo_size = 126          # splash de Plasma: gridUnit × 7
logo_offset = -36        # px del centro del logo al de la pantalla (− = arriba)
bar_width = 216          # gridUnit × 12
bar_height = 6
bar_min_height = 2       # px de pantalla, por pequeña que sea
bar_gap = 54             # del logo a la barra (gridUnit × 3)
bar_ease = 0.08          # en cada fotograma la barra avanza esta fracción de lo que le falta
field_width = 240        # campo de contraseña del disco (LUKS), estilo FileVault
field_height = 30
field_gap = 44           # del logo al campo
dot_size = 8             # puntos de la contraseña
capslock_size = 14       # aviso de Bloq Mayús dentro del campo
prompt_gap = 14          # del campo a la petición de contraseña
message_bottom = 64      # mensajes (fsck, actualizaciones…) desde el borde inferior
min_scale = 0.5          # escala mínima de las medidas en pantallas bajas
# Fuente del initramfs: el hook mete el archivo que resuelve fontconfig. Inter
# Variable (0,9 MB) en vez del alias GoldenGlass Sans, que da Inter.ttc (13 MB).
font = "Inter Variable"
font_size = 13
fade_ms = 400            # entrada del logo

[boot.dark]              # tema goldenglass (el de fábrica)
background = "#000000"
foreground = "#FFFFFF"
track_alpha = 0.25       # pista de la barra (primer plano con esta opacidad)
field_alpha = 0.14       # relleno del campo
field_border_alpha = 0.30
text_alpha = 0.65        # mensajes y petición de contraseña

[boot.light]             # tema goldenglass-light
background = "#E3E3E6"
foreground = "#1D1D1F"
track_alpha = 0.18
field_alpha = 0.08
field_border_alpha = 0.22
text_alpha = 0.60

# ---------------------------------------------------------------------------
# Pantalla de inicio de sesión (tema de SDDM, tools/login.py): como la de
# bloqueo de GoldenGlass. Fondo de día o de noche según la hora; los controles
# son siempre vidrio oscuro con texto claro, como el login de macOS.
# Medidas en px para una pantalla de 1080 líneas (el tema escala con la altura).
# ---------------------------------------------------------------------------
[login]
day_start = 7            # hora (0-23) desde la que se usa el fondo de día
night_start = 19         # hora desde la que se usa el fondo de noche
blur = 64                # radio del difuminado del fondo
dim = 0.18               # oscurecido sobre el fondo difuminado
clock_size = 96          # hora grande (px)
date_size = 26           # fecha encima de la hora
clock_top = 72           # del borde superior a la fecha
avatar_size = 112        # avatar del usuario elegido
avatar_small = 64        # avatares de la fila con varios usuarios
name_size = 20
field_width = 240        # campo de contraseña
field_height = 32
action_size = 30         # iconos de Reposo / Reiniciar / Apagar
bottom_margin = 48
text = "#FFFFFF"
text_alpha = 0.9
glass = "#FFFFFF"        # relleno de campo y botones (con glass_alpha)
glass_alpha = 0.16
glass_border_alpha = 0.28
error = "#FF6961"
background = "#101014"   # detrás del fondo de pantalla mientras carga
blur_saturation = 0.15   # saturación del fondo difuminado (0..1)
border_width = 1.5       # filo de avatares y botones con el foco
avatar_icon_scale = 0.62 # silueta sin foto, respecto al avatar
avatar_icon_alpha = 0.85
# fila de usuarios
users_bottom = 96        # de la fila a los botones de acciones
users_spacing = 36
user_padding = 24        # ancho extra de cada usuario sobre su avatar
user_name_gap = 10       # del avatar al nombre
user_name_size = 15
user_hover_scale = 1.08  # avatar bajo el cursor o con el foco
user_hover_ms = 120
# usuario elegido: avatar, nombre y contraseña
form_bottom = 72         # del bloque a los botones de acciones
form_spacing = 14
field_font_size = 15
field_padding = 14       # margen izquierdo del texto
field_border_width = 1
field_focus_alpha = 0.5  # filo del campo con el foco (color de texto)
placeholder_alpha = 0.55
password_spacing = 2     # entre los puntos de la contraseña
field_icon_scale = 0.62  # flecha y Bloq Mayús, respecto al alto del campo
message_height = 18      # aviso bajo el campo
small_size = 14          # texto de botones y avisos
# temblor del campo al fallar: desplazamiento (× shake_distance) y duración
# de cada tramo
shake_distance = 10
shake_steps = [-1.0, 1.0, -0.6, 0.3, 0.0]
shake_ms = [50, 70, 70, 60, 50]
back_margin = 48         # botón «volver a los usuarios», a la izquierda del bloque
# botones redondos (Reposo, Reiniciar, Apagar)
action_spacing = 28
action_circle_scale = 1.6    # círculo respecto al icono (action_size)
action_padding = 16          # ancho extra del botón sobre el círculo o el texto
action_caption_gap = 8       # del círculo al texto
# botones de las esquinas (sesión, teclado)
corner_margin = 24
corner_height = 30
corner_padding = 24          # ancho extra sobre icono y texto
corner_spacing = 8           # entre icono y texto
corner_icon = 18
menu_gap = 8                 # del botón de sesión a su menú

# ---------------------------------------------------------------------------
# Sonidos (tools/sounds.py): sintetizados, timbre de cristal
# ---------------------------------------------------------------------------
# Cada evento es una lista de capas que suenan desde `at` (s):
#   { tone = Hz, decay = s }       nota de cristal; decay = tiempo hasta -60 dB.
#                                  Opcionales: gain, glide (Hz al final),
#                                  attack (s), partials (si no, los de [sounds])
#   { noise = [Hz bajo, Hz alto], length = s }   ráfaga de ruido filtrado.
#                                  Opcionales: gain, grains + seed (ráfagas
#                                  sueltas repartidas en length, como papel)
# Un evento puede repetirse: repeat = veces, every = s entre repeticiones.
# Qué nombres freedesktop cubre cada evento se define en tools/sounds.py.
[sounds]
sample_rate = 48000
volume = 0.55            # pico de cada sonido (0..1) antes de su gain
attack = 0.003           # s, entrada de cada nota
reverb = 0.16            # mezcla de la cola de sala (da aire al cristal)
reverb_decay = 0.8       # s hasta -60 dB de la cola
# Parciales del cristal: [múltiplo de la fundamental, amplitud, decay ÷]
partials = [[1.0, 1.0, 1.0], [2.01, 0.30, 1.7], [3.03, 0.12, 2.6], [5.40, 0.05, 4.0]]

[sounds.events.alert]          # sonido de alerta (golpecito en un vaso)
layers = [
  { tone = 1661.2, decay = 0.20 },
  { tone = 2489.0, decay = 0.10, gain = 0.30 },
]

[sounds.events.notification]   # dos notas que suben
layers = [
  { tone = 1318.5, decay = 0.45 },
  { tone = 1975.5, decay = 0.55, at = 0.11 },
]

[sounds.events.trash]          # papel arrugado
gain = 0.8
layers = [{ noise = [1400.0, 6500.0], length = 0.55, grains = 16, seed = 7 }]

[sounds.events.screenshot]     # obturador: dos clics
gain = 0.8
layers = [
  { noise = [2000.0, 9000.0], length = 0.006 },
  { tone = 190.0, decay = 0.04, gain = 0.5, partials = [[1.0, 1.0, 1.0]] },
  { noise = [1500.0, 7000.0], length = 0.008, at = 0.085 },
]

[sounds.events.volume]         # «pop» corto al cambiar el volumen
gain = 0.7
layers = [{ tone = 880.0, glide = 620.0, decay = 0.07, partials = [[1.0, 1.0, 1.0]] }]

[sounds.events.device_added]
layers = [
  { tone = 1046.5, decay = 0.30 },
  { tone = 1568.0, decay = 0.40, at = 0.09 },
]

[sounds.events.device_removed]
layers = [
  { tone = 1568.0, decay = 0.30 },
  { tone = 1046.5, decay = 0.40, at = 0.09 },
]

[sounds.events.battery_low]
gain = 0.85
layers = [
  { tone = 880.0, decay = 0.45 },
  { tone = 659.3, decay = 0.60, at = 0.16 },
]

[sounds.events.power_plug]     # campanita al enchufar el cargador
layers = [
  { tone = 1046.5, decay = 0.70, attack = 0.006 },
  { tone = 1568.0, decay = 0.60, attack = 0.006, gain = 0.6 },
  { tone = 2093.0, decay = 0.50, attack = 0.006, gain = 0.35 },
]

[sounds.events.alarm]          # temporizador: tres tresillos
repeat = 3
every = 0.75
layers = [
  { tone = 1975.5, decay = 0.14 },
  { tone = 1975.5, decay = 0.14, at = 0.14 },
  { tone = 1975.5, decay = 0.20, at = 0.28 },
]

[sounds.events.auth]           # petición de contraseña de administrador
gain = 0.75
layers = [
  { tone = 880.0, decay = 0.35 },
  { tone = 1318.5, decay = 0.30, gain = 0.3 },
]

[sounds.events.login]          # chime al iniciar sesión: acorde abierto de do
gain = 1.0
layers = [
  { tone = 130.8, decay = 2.8, attack = 0.025, partials = [[1.0, 1.0, 1.0], [2.0, 0.5, 1.4], [3.0, 0.25, 2.0], [4.0, 0.12, 2.6]] },
  { tone = 196.0, decay = 2.6, attack = 0.025, partials = [[1.0, 1.0, 1.0], [2.0, 0.5, 1.4], [3.0, 0.25, 2.0], [4.0, 0.12, 2.6]] },
  { tone = 329.6, decay = 2.4, attack = 0.025, gain = 0.8 },
  { tone = 587.3, decay = 2.0, attack = 0.025, gain = 0.5 },
  { tone = 784.0, decay = 1.8, attack = 0.025, gain = 0.35 },
]

