# GoldenGlass — tokens de diseño (única fuente de verdad)
#
# Todo lo visual sale de aquí. Tras editar, regenerar con:
#   python3 tools/gen_tokens.py
#
# Formato de color: "#RRGGBB" o "#RRGGBBAA". Los colores con alfa se aplanan
# sobre el fondo de su rol al generar formatos que no admiten transparencia
# (p. ej. .colors de KDE).
#
# Valores marcados "calibrar" son iniciales: Apple no publica las cifras exactas
# de macOS 27 y se ajustan contra capturas.

[meta]
name = "GoldenGlass"
version = "0.2.1"

# ---------------------------------------------------------------------------
# Geometría (px lógicos)
# ---------------------------------------------------------------------------
[radius]
window = 12          # calibrar: macOS 27 cierra el radio respecto a Tahoe
control = 6          # botones, campos de texto, combos
control_small = 4    # checkboxes, controles compactos
field = 10           # campos de texto de Plasma (Spotlight, contraseña)
menu = 10            # menús emergentes
popup = 14           # diálogos de Plasma, notificaciones, Centro de control
dock = 14            # ≤ plasma.menubar_height / 2: Plasma limita la altura de
                     # todo panel a la suma de sus esquinas (ver plasma_theme)
tooltip = 6

# Anillo de foco de los campos de texto, como en macOS: color de acento
# translúcido pegado al borde del campo, sin halo difuminado.
[focus_ring]
width = 3            # ancho total del anillo
alpha = 0.5          # opacidad del acento

# ---------------------------------------------------------------------------
# Vidrio — niveles del slider (0.0 = más claro, 1.0 = más opaco)
# El slider es continuo; estos son los valores en las 3 muescas.
# "alpha" es la opacidad del fondo de las superficies de vidrio.
# ---------------------------------------------------------------------------
[glass]
default_level = 0.5
blur_strength = 10   # KWin Blur: 1..15, calibrar

[glass.notch.clear]
position = 0.0
alpha = 0.40

[glass.notch.medium]
position = 0.5
alpha = 0.65

[glass.notch.opaque]
position = 1.0
alpha = 0.90

[glass.border]
alpha = 0.14         # filo del vidrio (color de texto con esta opacidad)

# Saturación/contraste del fondo difuminado detrás del vidrio ("vibrancy").
# Se escribe en el plasmarc del Plasma Style.
[glass.vibrancy]
contrast = 1.0
intensity = 1.0
saturation = 1.8     # calibrar

# Refracción de Liquid Glass (efecto de KWin goldenglass_glass, solo superficies
# de Plasma). Medidas en px lógicos. Con el nivel de vidrio más claro se aplica
# entera; con el más opaco, por opaque_factor (macOS 27 hace lo mismo).
[glass.refraction]
edge = 18            # ancho de la zona del borde que se curva — calibrar
strength = 10        # desplazamiento del fondo en el mismo borde — calibrar
opaque_factor = 0.25 # fracción de la refracción con el vidrio más opaco
dispersion = 0.35    # separación de colores (fracción de strength)
clarity = 0.5        # en el borde, cuánto se ve el fondo nítido (no difuminado)
specular = 0.12      # brillo del filo (más arriba que abajo)
tint = 0.10          # acerca la luminancia del fondo a la media (legibilidad)

# ---------------------------------------------------------------------------
# Escritorio Plasma (px lógicos)
# ---------------------------------------------------------------------------
[plasma]
menubar_height = 28
menubar_padding = 6      # margen inferior del contenido de la barra
# Barra de menús sin fondo, como macOS 26/27 (el texto va sobre el fondo de
# pantalla). true = franja de vidrio translúcido, la opción «Mostrar fondo de la
# barra de menús» de macOS 27 (módulo Vidrio, goldenglass-glass).
menubar_background = false
# Con varias pantallas, opacidad de la barra de menús de las que no tienen la
# ventana activa (macOS la atenúa)
menubar_inactive_opacity = 0.5
menubar_item_padding = 11   # margen a cada lado del nombre de la app y de cada menú
menubar_tray_spacing = 16   # separación entre iconos de estado (múltiplo de 4)
dock_icon_size = 48
dock_padding = 6         # margen entre el borde del dock y los iconos
# Dock como en macOS con «Ocultar y mostrar automáticamente»: escondido hasta
# llevar el cursor al borde inferior. none | autohide | dodgewindows
dock_hiding = "autohide"
# Animación de deslizamiento de KWin (dock al aparecer/ocultarse y popups de
# Plasma): entra decelerando y sale acelerando. KWin usa 200 ms por defecto.
slide_in_ms = 280
slide_out_ms = 220
# Escritorios independientes por pantalla, como «Las pantallas tienen espacios
# independientes» de macOS (opción de KWin desde Plasma 6.7)
per_screen_desktops = true
popup_margin = 10        # margen de contenido de diálogos y popups
tooltip_margin = 6
popup_shadow = 28        # tamaño de la sombra de popups y dock
popup_shadow_alpha = 0.30
tooltip_shadow = 12
tooltip_shadow_alpha = 0.22
task_dot_size = 4        # indicador de app abierta en el dock
item_hover_alpha = 0.10  # resaltado de listas (sobre color de texto)
item_selected_alpha = 0.28  # selección de listas (sobre color de acento)

# ---------------------------------------------------------------------------
# Sombras de ventana
# ---------------------------------------------------------------------------
[shadow.active]
size = 64
strength = 0.45

[shadow.inactive]
size = 40
strength = 0.25

# ---------------------------------------------------------------------------
# Decoración de ventanas
# ---------------------------------------------------------------------------
[decoration]
# macOS centra el título en todo el ancho de la barra.
title_alignment = "AlignCenterFullWidth"  # AlignLeft | AlignCenter | AlignCenterFullWidth | AlignRight
# Barra de título de vidrio con la misma opacidad que la toolbar: ambas se ven
# como una sola superficie (toolbar unificada).
glass_titlebar = true

# ---------------------------------------------------------------------------
# Menús
# ---------------------------------------------------------------------------
[menu]
# macOS 27 quitó los iconos junto a cada comando: menús de solo texto, con ✓
# en el margen para las opciones activas.
show_icons = false

# ---------------------------------------------------------------------------
# Tipografía — familias son alias de fontconfig (ver fontconfig/)
# Tamaños en puntos de KDE (13 px de macOS ≈ 10 pt a 96 dpi)
# ---------------------------------------------------------------------------
[font]
sans = "GoldenGlass Sans"
mono = "GoldenGlass Mono"
size_general = 10
size_small = 8
size_toolbar = 10
size_menu = 10
size_window_title = 10
window_title_weight = "DemiBold"

# ---------------------------------------------------------------------------
# Semáforos (iguales en claro y oscuro)
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# Apps (lanzador del dock): panel centrado como el de Spotlight en macOS 26/27
# ---------------------------------------------------------------------------
[apps]
# Panel de Apps como el de macOS 27 (medidas calibradas con una captura):
# cabecera de buscador sin caja, etiquetas de categoría, fila de recientes,
# separador y todas las apps de la A a la Z.
width = 840          # px del panel de vidrio
height = 580
radius = 26          # esquinas del panel, más abiertas que las de un popup
margin = 20          # px entre el borde del panel y el contenido
header_height = 56   # fila del buscador (hasta la línea fina)
search_scale = 1.75  # texto del buscador respecto al texto normal
search_icon = 26     # px del glifo de Apps a la izquierda del buscador
separator_alpha = 0.14   # líneas finas (color de texto con esta opacidad)
chip_height = 26     # etiquetas de categoría: rectángulos redondeados
chip_radius = 7
chip_padding = 9     # px a cada lado del texto
chip_alpha = 0.10    # fondo de una etiqueta (color de texto)
chip_hover_alpha = 0.16
chip_selected_alpha = 0.30
columns = 7          # iconos por fila en cuadrícula
icon_size = 76       # px, cuadrícula (el squircle ocupa 52/64: ~62 px visibles)
row_height = 102     # px de cada fila de la cuadrícula
list_icon_size = 24  # px, lista
list_row_height = 36
recent = 7           # apps en la fila de recientes (una fila)
selected_alpha = 0.14    # selección con el teclado (color de texto)
selected_radius = 12
press_brightness = -0.35 # el icono se oscurece al pulsarlo, como en Launchpad
shadow_blur = 48     # sombra del panel
shadow_offset = 16
shadow_alpha = 0.35
# Al abrir, el panel crece desde open_scale con un resorte suave y aparece; al
# cerrar se encoge hasta close_scale y se desvanece, como Spotlight.
open_ms = 360
open_fade_ms = 140
open_scale = 0.94
open_overshoot = 1.0
close_ms = 160
close_scale = 0.96
close_unblur_at = 0.5    # fracción del cierre a la que se quita el blur de KWin
glass_update_ms = 32

[scroll]
# Desplazamiento como en macOS (GlassScrollView de los plasmoids): barra
# superpuesta que solo aparece al desplazarse, rueda suave, inercia del touchpad
# y rebote elástico en los extremos.
wheel_step = 100         # px por paso de la rueda del ratón
wheel_ms = 260           # animación de cada paso de rueda
rubber_band = 0.55       # resistencia del rebote (la constante de UIScrollView)
rebound_ms = 450         # vuelta al borde tras estirarse
deceleration = 2500      # px/s², inercia al soltar el touchpad
max_velocity = 6000      # px/s
min_fling = 120          # px/s mínimos para que siga deslizándose al soltar
bar_width = 7            # tirador de la barra superpuesta
bar_hover_width = 11     # al pasar el ratón por el borde (aparece el carril)
bar_margin = 3           # px entre el tirador y el borde
bar_min = 32             # alto mínimo del tirador
bar_alpha = 0.45         # tirador (color de texto)
bar_track_alpha = 0.08   # carril, solo con el ratón encima
bar_hide_ms = 900        # sin desplazarse, la barra se esconde tras esto
bar_fade_ms = 250
edge_fade = 28           # px del borde difuminado bajo las etiquetas

[traffic_lights]
# macOS 27 (Golden Gate): gemas de vidrio algo mayores que los 12 px planos
# de Big Sur–Tahoe, con brillo arriba y abajo. Glifo tintado por botón.
diameter = 14        # px
gap = 8              # px entre bordes de círculos (centros a diameter + gap)
inactive_colored = true  # también en color en ventanas sin foco (macOS los pone grises)
close = "#FF5F57"
close_border = "#E0443E"
close_glyph = "#4D0000"
minimize = "#FEBC2E"
minimize_border = "#DEA123"
minimize_glyph = "#995700"
zoom = "#28C840"
zoom_border = "#1AAB29"
zoom_glyph = "#006500"

# ---------------------------------------------------------------------------
# Dock (plasmoid org.goldenglass.dock): ampliación, rebote, apps recientes y
# vistas previas, como el Dock de macOS. Tamaño de icono y relleno de la placa
# en [plasma] (dock_icon_size, dock_padding). Los valores de fábrica de los
# ajustes del módulo «Dock» salen de aquí.
# ---------------------------------------------------------------------------
[dock]
magnification = true     # de fábrica activada (macOS la trae apagada)
magnification_size = 96  # px del icono bajo el cursor
spread = 2.6             # iconos a cada lado que crecen con él
magnification_ms = 110   # suavizado al entrar y salir el cursor
gap = 6                  # px entre iconos
bounce = 0.55            # altura del rebote (× tamaño del icono)
bounce_ms = 360          # duración de un rebote
attention_bounces = 8    # rebotes al pedir atención (luego queda quieto)
show_recent = true       # apps recientes no fijadas, tras un separador
recent_count = 3
preview_width = 220      # px de las miniaturas de ventanas en el tooltip
label_delay_ms = 400     # espera antes del nombre de la app al pasar el ratón

# ---------------------------------------------------------------------------
# Centro de control (plasmoid org.goldenglass.controlcenter): cuadrícula de 4
# columnas como la de macOS 26. Un botón redondo ocupa una celda, una píldora
# (Wi‑Fi, Bluetooth…) dos y «Reproducción» 2 × 2; los sliders, la fila entera.
# ---------------------------------------------------------------------------
[control_center]
floating_margin = 6      # px entre la barra de menús y las tarjetas
screen_margin = 8        # px entre las tarjetas y el borde derecho de la pantalla
# Animaciones de Liquid Glass. Al abrir, el vidrio brota del icono con un
# resorte: crece desde open_scale_x × open_scale_y y se pasa un poco
# (open_overshoot: el «overshoot» de Easing.OutBack) antes de asentarse.
open_ms = 420            # resorte a lo ancho
open_ms_y = 480          # a lo alto se asienta después: el vidrio «cae» de la barra
open_fade_ms = 140
open_scale_x = 0.85
open_scale_y = 0.6
open_overshoot = 1.2
switch_scale = 0.94      # vista de detalle ↔ cuadrícula: brota desde aquí
close_ms = 180           # al cerrar: se encoge hacia el icono y se desvanece
close_scale = 0.92
# KWin no difumina a medias: el vidrio se quita a esta fracción del cierre,
# cuando las tarjetas ya casi no se ven
close_unblur_at = 0.5
glass_update_ms = 32     # mínimo entre dos regiones de blur enviadas a KWin
# Al pulsar una tarjeta: cede, se ilumina desde el punto de contacto y al
# soltarla vuelve con un rebote
press_scale = 0.95
press_ms = 90
release_ms = 380
release_overshoot = 2.2
press_brighten_alpha = 0.08
press_glow_alpha = 0.22
press_glow_radius = 72   # px del brillo alrededor del punto de contacto
icon_highlight_alpha = 0.18  # resaltado del icono de la barra mientras está abierto
icon_highlight_radius = 5
icon_highlight_padding = 4   # px a cada lado del icono
icon_highlight_inset = 3     # px por arriba y por abajo dentro de la barra
cell = 64                # px del lado de una celda (botón redondo)
gap = 12                 # px entre celdas
tile_radius = 24         # tarjetas rectangulares (sliders, Reproducción)
icon_circle = 36         # círculo del icono dentro de las píldoras
icon = 20                # glifo de las píldoras
round_icon = 22          # glifo de los botones redondos
off_alpha = 0.14         # círculo de un control apagado
off_hover_alpha = 0.22
slider_height = 6        # pista de los sliders
slider_track_alpha = 0.20
# Las tarjetas son más claras que los popups, como en macOS 26: fondo de
# vidrio con esta opacidad, sin seguir el nivel de vidrio
tile_alpha = 0.30
# Vistas de detalle (clic en Wi‑Fi, Bluetooth, Enfoque, Pantalla, Sonido o
# Reproducción): una tarjeta con título, lista y «Ajustes de…»
detail_title_scale = 1.15    # título respecto al texto normal
detail_max_height = 360      # px de lista antes de desplazarse
row_height = 36
row_radius = 8
row_hover_alpha = 0.08
row_circle = 26              # círculo del icono de cada fila
row_icon = 16
separator_alpha = 0.12
switch_width = 36            # interruptor de la cabecera
switch_height = 20

# ---------------------------------------------------------------------------
# Arranque (Plymouth, tools/plymouth.py): logo y barra fina como el arranque de
# Mac, con las proporciones del splash de Plasma. Medidas en px para una
# pantalla de 1080 líneas; el script las escala con la altura de la pantalla.
# ---------------------------------------------------------------------------
[boot]
logo_size = 126          # splash de Plasma: gridUnit × 7
logo_offset = -36        # px del centro del logo al de la pantalla (− = arriba)
bar_width = 216          # gridUnit × 12
bar_height = 6
bar_gap = 54             # del logo a la barra (gridUnit × 3)
field_width = 240        # campo de contraseña del disco (LUKS), estilo FileVault
field_height = 30
field_gap = 44           # del logo al campo
dot_size = 8             # puntos de la contraseña
# Fuente del initramfs: el hook mete el archivo que resuelve fontconfig. Inter
# Variable (0,9 MB) en vez del alias GoldenGlass Sans, que da Inter.ttc (13 MB).
font = "Inter Variable"
font_size = 13
fade_ms = 400            # entrada del logo

[boot.dark]              # tema goldenglass (el de fábrica)
background = "#000000"
foreground = "#FFFFFF"
track_alpha = 0.25       # pista de la barra (primer plano con esta opacidad)
field_alpha = 0.14       # relleno del campo
field_border_alpha = 0.30
text_alpha = 0.65        # mensajes y petición de contraseña

[boot.light]             # tema goldenglass-light
background = "#E3E3E6"
foreground = "#1D1D1F"
track_alpha = 0.18
field_alpha = 0.08
field_border_alpha = 0.22
text_alpha = 0.60

# ---------------------------------------------------------------------------
# Pantalla de inicio de sesión (tema de SDDM, tools/login.py): como la de
# bloqueo de GoldenGlass. Fondo de día o de noche según la hora; los controles
# son siempre vidrio oscuro con texto claro, como el login de macOS.
# Medidas en px para una pantalla de 1080 líneas (el tema escala con la altura).
# ---------------------------------------------------------------------------
[login]
day_start = 7            # hora (0-23) desde la que se usa el fondo de día
night_start = 19         # hora desde la que se usa el fondo de noche
blur = 64                # radio del difuminado del fondo
dim = 0.18               # oscurecido sobre el fondo difuminado
clock_size = 96          # hora grande (px)
date_size = 26           # fecha encima de la hora
clock_top = 72           # del borde superior a la fecha
avatar_size = 112        # avatar del usuario elegido
avatar_small = 64        # avatares de la fila con varios usuarios
name_size = 20
field_width = 240        # campo de contraseña
field_height = 32
action_size = 30         # iconos de Reposo / Reiniciar / Apagar
bottom_margin = 48
text = "#FFFFFF"
text_alpha = 0.9
glass = "#FFFFFF"        # relleno de campo y botones (con glass_alpha)
glass_alpha = 0.16
glass_border_alpha = 0.28
error = "#FF6961"

# ---------------------------------------------------------------------------
# Sonidos (tools/sounds.py): sintetizados, timbre de cristal
# ---------------------------------------------------------------------------
# Cada evento es una lista de capas que suenan desde `at` (s):
#   { tone = Hz, decay = s }       nota de cristal; decay = tiempo hasta -60 dB.
#                                  Opcionales: gain, glide (Hz al final),
#                                  attack (s), partials (si no, los de [sounds])
#   { noise = [Hz bajo, Hz alto], length = s }   ráfaga de ruido filtrado.
#                                  Opcionales: gain, grains + seed (ráfagas
#                                  sueltas repartidas en length, como papel)
# Un evento puede repetirse: repeat = veces, every = s entre repeticiones.
# Qué nombres freedesktop cubre cada evento se define en tools/sounds.py.
[sounds]
sample_rate = 48000
volume = 0.55            # pico de cada sonido (0..1) antes de su gain
attack = 0.003           # s, entrada de cada nota
reverb = 0.16            # mezcla de la cola de sala (da aire al cristal)
reverb_decay = 0.8       # s hasta -60 dB de la cola
# Parciales del cristal: [múltiplo de la fundamental, amplitud, decay ÷]
partials = [[1.0, 1.0, 1.0], [2.01, 0.30, 1.7], [3.03, 0.12, 2.6], [5.40, 0.05, 4.0]]

[sounds.events.alert]          # sonido de alerta (golpecito en un vaso)
layers = [
  { tone = 1661.2, decay = 0.20 },
  { tone = 2489.0, decay = 0.10, gain = 0.30 },
]

[sounds.events.notification]   # dos notas que suben
layers = [
  { tone = 1318.5, decay = 0.45 },
  { tone = 1975.5, decay = 0.55, at = 0.11 },
]

[sounds.events.trash]          # papel arrugado
gain = 0.8
layers = [{ noise = [1400.0, 6500.0], length = 0.55, grains = 16, seed = 7 }]

[sounds.events.screenshot]     # obturador: dos clics
gain = 0.8
layers = [
  { noise = [2000.0, 9000.0], length = 0.006 },
  { tone = 190.0, decay = 0.04, gain = 0.5, partials = [[1.0, 1.0, 1.0]] },
  { noise = [1500.0, 7000.0], length = 0.008, at = 0.085 },
]

[sounds.events.volume]         # «pop» corto al cambiar el volumen
gain = 0.7
layers = [{ tone = 880.0, glide = 620.0, decay = 0.07, partials = [[1.0, 1.0, 1.0]] }]

[sounds.events.device_added]
layers = [
  { tone = 1046.5, decay = 0.30 },
  { tone = 1568.0, decay = 0.40, at = 0.09 },
]

[sounds.events.device_removed]
layers = [
  { tone = 1568.0, decay = 0.30 },
  { tone = 1046.5, decay = 0.40, at = 0.09 },
]

[sounds.events.battery_low]
gain = 0.85
layers = [
  { tone = 880.0, decay = 0.45 },
  { tone = 659.3, decay = 0.60, at = 0.16 },
]

[sounds.events.power_plug]     # campanita al enchufar el cargador
layers = [
  { tone = 1046.5, decay = 0.70, attack = 0.006 },
  { tone = 1568.0, decay = 0.60, attack = 0.006, gain = 0.6 },
  { tone = 2093.0, decay = 0.50, attack = 0.006, gain = 0.35 },
]

[sounds.events.alarm]          # temporizador: tres tresillos
repeat = 3
every = 0.75
layers = [
  { tone = 1975.5, decay = 0.14 },
  { tone = 1975.5, decay = 0.14, at = 0.14 },
  { tone = 1975.5, decay = 0.20, at = 0.28 },
]

[sounds.events.auth]           # petición de contraseña de administrador
gain = 0.75
layers = [
  { tone = 880.0, decay = 0.35 },
  { tone = 1318.5, decay = 0.30, gain = 0.3 },
]

[sounds.events.login]          # chime al iniciar sesión: acorde abierto de do
gain = 1.0
layers = [
  { tone = 130.8, decay = 2.8, attack = 0.025, partials = [[1.0, 1.0, 1.0], [2.0, 0.5, 1.4], [3.0, 0.25, 2.0], [4.0, 0.12, 2.6]] },
  { tone = 196.0, decay = 2.6, attack = 0.025, partials = [[1.0, 1.0, 1.0], [2.0, 0.5, 1.4], [3.0, 0.25, 2.0], [4.0, 0.12, 2.6]] },
  { tone = 329.6, decay = 2.4, attack = 0.025, gain = 0.8 },
  { tone = 587.3, decay = 2.0, attack = 0.025, gain = 0.5 },
  { tone = 784.0, decay = 1.8, attack = 0.025, gain = 0.35 },
]

# ---------------------------------------------------------------------------
# Paleta clara
# ---------------------------------------------------------------------------
[light]
accent = "#007AFF"
accent_fg = "#FFFFFF"
link = "#0068DA"
visited = "#AF52DE"
positive = "#34C759"
neutral = "#FF9500"
negative = "#FF3B30"

# Texto (macOS usa negro con alfa; se aplana sobre cada fondo)
label = "#000000D9"            # 85 %
label_secondary = "#00000080"  # 50 %
label_tertiary = "#00000040"   # 25 % (deshabilitado)

# Superficies
window = "#ECECEC"
window_alt = "#E3E3E3"
view = "#FFFFFF"
view_alt = "#F4F5F5"
button = "#FFFFFF"
button_alt = "#E5E5E5"
header = "#F6F6F6"             # barra de título + toolbar unificadas
header_inactive = "#ECECEC"
sidebar = "#E1E1E1"            # macOS 27: sidebar más oscura que la ventana
tooltip = "#F6F6F6"
complementary = "#1E1E1E"      # OSD, pantalla de bloqueo
selection_inactive = "#DCDCDC"
separator = "#0000001A"

traffic_light_inactive = "#D1D1D1"

# ---------------------------------------------------------------------------
# Paleta oscura
# ---------------------------------------------------------------------------
[dark]
accent = "#0A84FF"
accent_fg = "#FFFFFF"
link = "#419CFF"
visited = "#BF5AF2"
positive = "#30D158"
neutral = "#FF9F0A"
negative = "#FF453A"

label = "#FFFFFFD9"
label_secondary = "#FFFFFF8C"  # 55 %
label_tertiary = "#FFFFFF40"

window = "#323232"
window_alt = "#2B2B2B"
view = "#1E1E1E"
view_alt = "#262626"
button = "#5C5C5C"
button_alt = "#4A4A4A"
header = "#383838"
header_inactive = "#2D2D2D"
sidebar = "#262626"
tooltip = "#2A2A2A"
complementary = "#141414"
selection_inactive = "#464646"
separator = "#FFFFFF1A"

traffic_light_inactive = "#4D4D4D"
