<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  SPDX-License-Identifier: GPL-3.0-or-later

  GoldenGlass: familias virtuales. KDE se configura siempre con estos nombres;
  fontconfig elige SF Pro si el usuario la instaló por su cuenta (no se
  redistribuye) y si no cae a Inter.
-->
<fontconfig>
  <alias binding="same">
    <family>GoldenGlass Sans</family>
    <prefer>
      <family>SF Pro</family>
      <family>SF Pro Text</family>
      <family>Inter</family>
      <family>Inter Variable</family>
    </prefer>
    <default><family>sans-serif</family></default>
  </alias>

  <alias binding="same">
    <family>GoldenGlass Mono</family>
    <prefer>
      <family>SF Mono</family>
      <family>JetBrains Mono</family>
      <family>Hack</family>
    </prefer>
    <default><family>monospace</family></default>
  </alias>
</fontconfig>
